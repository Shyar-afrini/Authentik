# Local Redis for development:  docker compose -f infrastructure/docker/redis.compose.yml up -d
name: authentik-dev
services:
  redis:
    image: redis:7-alpine
    container_name: authentik-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6395:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
